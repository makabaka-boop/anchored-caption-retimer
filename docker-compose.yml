services:
  web:
    build:
      context: .
      target: web
    image: cue-lock-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: cue-lock-verify:latest
    profiles:
      - verify
    # 一次性验收：跑完即退出（退出码即验收结论）
    command: ["npm", "run", "verify"]
